[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
model = { path = "crates/model" }
devices = { path = "crates/devices" }
recording = { path = "crates/recording" }
analysis = { path = "crates/analysis" }
store = { path = "crates/store" }
server = { path = "crates/server" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
zstd = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hidapi = { version = "2", default-features = false, features = ["linux-native"] }
btleplug = "0.11"
uuid = "1"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
csv = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs"] }
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "0.14", features = ["x509-parser"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
qrcode = { version = "0.14", default-features = false }
x509-parser = "0.18"
time = { version = "0.3", default-features = false, features = ["std"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
